<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060c14" />
  <title>TGM Micro-City · Wirtschaftsingenieurwesen & Betriebsinformatik</title>
  <style>
    :root {
      --ink: #eaf4fb;
      --muted: #8ea6b7;
      --faint: #5b7485;
      --line: rgba(142, 190, 216, 0.16);
      --glass: rgba(7, 15, 25, 0.72);
      --accent: #4be4ff;
      --factory: #ff8f5c;
      --hub: #4be4ff;
      --tower: #ffd37a;
      --logistics: #6fe3a8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse 70% 58% at 62% 28%, rgba(23, 71, 91, 0.48), transparent 62%),
        radial-gradient(ellipse 55% 55% at 20% 72%, rgba(34, 48, 89, 0.34), transparent 68%),
        linear-gradient(155deg, #07111c 0%, #050a12 52%, #04070c 100%);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid rgba(75, 228, 255, 0.8); outline-offset: 3px; }

    #webgl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      outline: none;
    }
    #webgl:active { cursor: grabbing; }
    #webgl.is-hovering { cursor: pointer; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(3, 7, 12, 0.46) 0%, transparent 23%, transparent 72%, rgba(2, 5, 9, 0.62) 100%),
        radial-gradient(ellipse at center, transparent 42%, rgba(2, 6, 11, 0.48) 100%);
      z-index: 2;
    }

    .ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    .brand {
      position: absolute;
      top: clamp(18px, 3vw, 32px);
      left: clamp(18px, 3vw, 36px);
      display: flex;
      align-items: flex-start;
      gap: 13px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.8s ease 0.25s, transform 0.8s ease 0.25s;
    }
    body.is-ready .brand { opacity: 1; transform: none; }

    .brand-mark {
      width: 35px;
      height: 35px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      border: 1px solid rgba(157, 206, 231, 0.35);
      border-radius: 8px;
      background: rgba(6, 15, 25, 0.55);
      box-shadow: 0 0 26px rgba(75, 228, 255, 0.08), inset 0 0 12px rgba(75, 228, 255, 0.05);
      transform: rotate(0deg);
    }
    .brand-mark i { display: block; border-radius: 2px; opacity: 0.9; }
    .brand-mark i:nth-child(1) { background: var(--factory); }
    .brand-mark i:nth-child(2) { background: var(--hub); }
    .brand-mark i:nth-child(3) { background: var(--logistics); }
    .brand-mark i:nth-child(4) { background: var(--tower); }

    .brand-overline {
      margin: 1px 0 5px;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.22em;
      color: #7ec7dd;
      white-space: nowrap;
    }
    .brand-title {
      margin: 0;
      max-width: 410px;
      font-size: clamp(12px, 1.18vw, 15px);
      font-weight: 520;
      line-height: 1.38;
      letter-spacing: 0.005em;
      color: rgba(233, 245, 251, 0.9);
    }
    .brand-title span { color: var(--muted); font-weight: 420; }

    .overview-btn {
      position: absolute;
      top: clamp(18px, 3vw, 32px);
      right: clamp(18px, 3vw, 36px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px 10px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(6, 14, 23, 0.58);
      color: #b8cad6;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    body.is-ready .overview-btn { opacity: 1; transform: none; }
    .overview-btn:hover { color: var(--ink); background: rgba(14, 34, 48, 0.82); border-color: rgba(75, 228, 255, 0.34); }
    .overview-btn svg { width: 14px; height: 14px; flex: none; }
    .overview-btn kbd {
      margin-left: 2px;
      padding: 2px 5px;
      border: 1px solid rgba(142, 190, 216, 0.2);
      border-radius: 4px;
      color: var(--faint);
      font: inherit;
      font-size: 8px;
      letter-spacing: 0.06em;
    }
    body.has-selection .overview-btn { color: var(--ink); border-color: rgba(75, 228, 255, 0.28); box-shadow: 0 0 24px rgba(75, 228, 255, 0.06); }

    
    .drive-btn {
      right: calc(clamp(18px, 3vw, 36px) + 124px);
      color: #7ee7be;
      border-color: rgba(111, 227, 168, 0.28);
    }
    .drive-btn:hover {
      border-color: rgba(111, 227, 168, 0.55);
      background: rgba(11, 38, 30, 0.82);
      color: #a4fbd5;
    }
    body.is-driving .drive-btn {
      color: #061510;
      background: #6fe3a8;
      border-color: #6fe3a8;
      box-shadow: 0 0 24px rgba(111, 227, 168, 0.45);
    }

    .drive-hud {
      position: absolute;
      left: clamp(18px, 3vw, 36px);
      bottom: clamp(16px, 2.4vw, 26px);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 17px;
      border: 1px solid rgba(111, 227, 168, 0.32);
      border-radius: 10px;
      background: rgba(5, 18, 24, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #eaf4fb;
      font-family: var(--mono);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }
    body.is-driving .drive-hud {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    body.is-driving .hint,
    body.is-driving .district-nav {
      opacity: 0;
      pointer-events: none;
    }
    .drive-speed {
      font-size: 20px;
      font-weight: 700;
      color: #6fe3a8;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .drive-speed small {
      font-size: 9px;
      color: #8ea6b7;
      letter-spacing: 0.1em;
    }
    .drive-gear {
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(111, 227, 168, 0.16);
      border: 1px solid rgba(111, 227, 168, 0.45);
      color: #6fe3a8;
      font-size: 11px;
      font-weight: 700;
    }
    .drive-help {
      font-size: 9.5px;
      color: #8ea6b7;
      letter-spacing: 0.05em;
    }
    .drive-help b {
      color: #dcecf5;
    }

    .hint {
      position: absolute;
      left: clamp(18px, 3vw, 36px);
      bottom: clamp(16px, 2.4vw, 26px);
      display: flex;
      gap: 17px;
      align-items: center;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #668394;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease 0.55s, transform 0.8s ease 0.55s;
    }
    body.is-ready .hint { opacity: 1; transform: none; }
    .hint span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .hint .hint-touch { display: none; }
    .hint b { color: #9bb3c1; font-weight: 500; }
    .hint .keycap {
      min-width: 18px;
      padding: 2px 4px;
      border: 1px solid rgba(142, 190, 216, 0.2);
      border-radius: 3px;
      text-align: center;
      font-weight: 400;
      color: #8da9b9;
    }

    .district-nav {
      position: absolute;
      left: 50%;
      bottom: clamp(16px, 2.4vw, 26px);
      transform: translate(-50%, 8px);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid rgba(142, 190, 216, 0.11);
      border-radius: 10px;
      background: rgba(5, 13, 21, 0.46);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.8s ease 0.65s, transform 0.8s ease 0.65s;
    }
    body.is-ready .district-nav { opacity: 1; transform: translate(-50%, 0); }
    .district-nav button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #7e97a7;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.075em;
      text-transform: uppercase;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .district-nav button:hover { color: #d9e8f0; background: rgba(137, 190, 215, 0.09); }
    .district-nav button.is-selected { color: #eef8fd; background: rgba(137, 190, 215, 0.13); }
    .district-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); flex: none; }
    .district-index { color: #476271; }

    .hover-tag {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px 6px 7px;
      border: 1px solid rgba(142, 190, 216, 0.22);
      border-radius: 6px;
      background: rgba(5, 13, 22, 0.82);
      color: #dcecf5;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transform: translate(14px, 14px) scale(0.96);
      transition: opacity 0.15s ease, transform 0.15s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }
    .hover-tag.is-visible { opacity: 1; transform: translate(14px, 14px) scale(1); }
    .hover-tag i { width: 5px; height: 5px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 7px var(--dot); }
    .hover-tag em { font-style: normal; color: #7893a3; font-size: 8px; }

    .info-panel {
      position: absolute;
      right: clamp(16px, 3vw, 36px);
      bottom: clamp(16px, 3vw, 32px);
      width: min(366px, calc(100vw - 32px));
      padding: 18px 19px 17px;
      border: 1px solid rgba(142, 190, 216, 0.2);
      border-radius: 13px;
      background:
        linear-gradient(145deg, rgba(13, 28, 41, 0.9), rgba(5, 13, 22, 0.86)),
        rgba(5, 12, 20, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(24px) scale(0.985);
      transform-origin: bottom right;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 0.9, 0.28, 1), visibility 0.45s;
      visibility: hidden;
      overflow: hidden;
    }
    .info-panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--panel-accent), transparent);
      opacity: 0.9;
    }
    .info-panel::after {
      content: "";
      position: absolute;
      top: -60px;
      right: -50px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--panel-accent) 16%, transparent), transparent 68%);
      pointer-events: none;
    }
    .info-panel.is-open {
      pointer-events: auto;
      opacity: 1;
      transform: none;
      visibility: visible;
    }
    .panel-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .panel-index {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--panel-accent);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
    }
    .panel-index::before { content: ""; width: 19px; height: 1px; background: var(--panel-accent); opacity: 0.65; }
    .panel-close {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(142, 190, 216, 0.13);
      border-radius: 6px;
      background: transparent;
      color: #7892a1;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .panel-close:hover { color: #fff; border-color: rgba(142, 190, 216, 0.35); background: rgba(142, 190, 216, 0.08); }
    .panel-kicker {
      margin: 0 0 5px;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--panel-accent) 78%, white 12%);
    }
    .panel-title {
      margin: 0;
      color: #f0f8fd;
      font-size: 27px;
      line-height: 1.06;
      letter-spacing: -0.035em;
      font-weight: 560;
    }
    .panel-lead {
      margin: 10px 0 14px;
      color: #9eb5c3;
      font-size: 12px;
      line-height: 1.62;
      font-weight: 390;
    }
    .panel-list {
      display: grid;
      gap: 7px;
      margin: 0 0 15px;
      padding: 0;
      list-style: none;
    }
    .panel-list li {
      position: relative;
      padding-left: 14px;
      color: #b7cbd6;
      font-size: 10.5px;
      line-height: 1.45;
    }
    .panel-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.54em;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--panel-accent);
      box-shadow: 0 0 7px color-mix(in srgb, var(--panel-accent) 70%, transparent);
      opacity: 0.85;
    }
    .panel-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-bottom: 13px;
      border: 1px solid rgba(142, 190, 216, 0.11);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(142, 190, 216, 0.08);
    }
    .panel-stat { padding: 9px 9px 8px; background: rgba(6, 15, 24, 0.72); }
    .panel-stat strong {
      display: block;
      color: #e8f4fa;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .panel-stat span {
      display: block;
      margin-top: 3px;
      color: #617c8c;
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 0.04em;
      line-height: 1.25;
      text-transform: uppercase;
    }
    .panel-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .panel-tag {
      padding: 4px 6px;
      border: 1px solid rgba(142, 190, 216, 0.13);
      border-radius: 4px;
      color: #7e99a9;
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .panel-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(142, 190, 216, 0.18);
      border-radius: 6px;
      background: rgba(142, 190, 216, 0.06);
      color: #b8ceda;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .panel-back:hover { background: rgba(142, 190, 216, 0.13); color: #fff; border-color: rgba(142, 190, 216, 0.32); }
    .panel-back svg { width: 12px; height: 12px; }
    .panel-note { color: #486170; font-family: var(--mono); font-size: 7px; letter-spacing: 0.05em; text-align: right; line-height: 1.35; }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 55% 42%, rgba(18, 52, 68, 0.42), transparent 52%),
        #050a11;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    body.is-ready .loader { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-core { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .loader-orbit { position: relative; width: 46px; height: 46px; }
    .loader-orbit::before, .loader-orbit::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(75, 228, 255, 0.18);
      border-radius: 50%;
    }
    .loader-orbit::after {
      inset: 8px;
      border-color: rgba(255, 211, 122, 0.23);
      animation: spin 3.5s linear infinite reverse;
    }
    .loader-orbit span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      margin: -2.5px;
      border-radius: 50%;
      background: #8df3ff;
      box-shadow: 0 0 16px #4be4ff;
      animation: orbit 2.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .loader p {
      margin: 0;
      color: #6f8a9c;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .loader small { display: block; margin-top: 5px; color: #3e5869; font-size: 7px; letter-spacing: 0.12em; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(21px); }
      100% { transform: rotate(360deg) translateX(21px); }
    }

    @media (max-width: 1180px) {
      .hint span:nth-child(2), .hint span:nth-child(4) { display: none; }
    }
    @media (max-width: 900px) {
      .brand-title { max-width: 265px; }
      .district-nav { display: none; }
      .hint { gap: 10px; }
      .hint span:nth-child(2), .hint span:nth-child(3), .hint span:nth-child(4) { display: none; }
      .hint .hint-touch { display: inline-flex; }
    }
    @media (max-height: 600px) {
      .info-panel {
        top: 12px;
        bottom: 12px;
        width: min(342px, 45vw);
        padding: 14px 16px;
        overflow-y: auto;
      }
      .panel-top { margin-bottom: 8px; }
      .panel-title { font-size: 22px; }
      .panel-lead { margin: 8px 0 10px; font-size: 10.5px; line-height: 1.5; }
      .panel-list { gap: 4px; margin-bottom: 10px; }
      .panel-list li { font-size: 9.5px; }
      .panel-stats { margin-bottom: 9px; }
      .panel-tags { margin-bottom: 10px; }
      .brand-title { display: none; }
      .brand-overline { margin-bottom: 0; }
      .hint { display: none; }
      .overview-btn kbd { display: none; }
    }
    @media (max-width: 620px) {
      .brand { gap: 10px; }
      .brand-mark { width: 30px; height: 30px; }
      .brand-title { max-width: 205px; font-size: 10.5px; }
      .brand-overline { font-size: 8px; }
      .overview-btn kbd { display: none; }
      .overview-btn { padding: 9px 10px; }
      .info-panel {
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        max-height: 52vh;
        overflow-y: auto;
        padding: 15px 15px 14px;
        transform-origin: bottom center;
      }
      .panel-title { font-size: 23px; }
      .panel-lead { font-size: 11px; margin-bottom: 11px; }
      .panel-list { gap: 5px; margin-bottom: 12px; }
      .panel-list li { font-size: 10px; }
      .panel-tags { margin-bottom: 12px; }
      .hint { left: 12px; bottom: 12px; font-size: 8px; }
      .hover-tag { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="webgl" aria-label="Interaktive 3D-Darstellung des TGM-Campus"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="ui">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div>
        <p class="brand-overline">TGM · MICRO-CITY / CAMPUS 04</p>
        <h1 class="brand-title">Wirtschaftsingenieurwesen <span>&amp; Betriebsinformatik</span></h1>
      </div>
    </header>

        <button class="overview-btn drive-btn" id="driveBtn" type="button" aria-label="Fahrzeug steuern">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">

    function addBox(parent, w, h, d, material, x = 0, y = 0, z = 0, options = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      if (options.rx) mesh.rotation.x = options.rx;
      if (options.ry) mesh.rotation.y = options.ry;
      if (options.rz) mesh.rotation.z = options.rz;
      mesh.castShadow = options.cast !== false;
      mesh.receiveShadow = options.receive !== false;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radiusTop, radiusBottom, height, segments, material, x = 0, y = 0, z = 0, options = {}) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
      mesh.position.set(x, y, z);
      if (options.rx) mesh.rotation.x = options.rx;
      if (options.ry) mesh.rotation.y = options.ry;
      if (options.rz) mesh.rotation.z = options.rz;
      mesh.castShadow = options.cast !== false;
      mesh.receiveShadow = options.receive !== false;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(parent, radius, material, x = 0, y = 0, z = 0, segments = 12, options = {}) {
      const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(radius, options.detail ?? 1), material);
      mesh.position.set(x, y, z);
      if (options.scaleY) mesh.scale.y = options.scaleY;
      mesh.castShadow = options.cast !== false;
      mesh.receiveShadow = options.receive !== false;
      parent.add(mesh);
      return mesh;
    }

    function roundedRectShape(width, depth, radius) {
      const x = -width / 2;
      const y = -depth / 2;
      const r = Math.min(radius, width / 2, depth / 2);
      const shape = new THREE.Shape();
      shape.moveTo(x + r, y);
      shape.lineTo(x + width - r, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + r);
      shape.lineTo(x + width, y + depth - r);
      shape.quadraticCurveTo(x + width, y + depth, x + width - r, y + depth);
      shape.lineTo(x + r, y + depth);
      shape.quadraticCurveTo(x, y + depth, x, y + depth - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function addRoundedSlab(parent, width, depth, height, radius, material, topY = 0) {
      const geometry = new THREE.ExtrudeGeometry(roundedRectShape(width, depth, radius), {
        depth: height,
        bevelEnabled: false,
        curveSegments: 7
      });
      geometry.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = topY - height;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addFlatRounded(parent, width, depth, radius, material, y = 0) {
      const geometry = new THREE.ShapeGeometry(roundedRectShape(width, depth, radius), 7);
      geometry.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = y;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addFlatRing(parent, outerWidth, outerDepth, outerRadius, thickness, material, y = 0) {
      const shape = roundedRectShape(outerWidth, outerDepth, outerRadius);
      const holeWidth = outerWidth - thickness * 2;
      const holeDepth = outerDepth - thickness * 2;
      const hole = roundedRectShape(holeWidth, holeDepth, Math.max(0.1, outerRadius - thickness));
      shape.holes.push(hole);
      const geometry = new THREE.ShapeGeometry(shape, 12);
      geometry.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = y;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addRoundedLine(parent, width, depth, radius, y, color, opacity = 0.5) {
      const points = roundedRectShape(width, depth, radius).getPoints(28).map((p) => new THREE.Vector3(p.x, y, -p.y));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
      parent.add(line);
      return line;
    }

    function makeRadialTexture(size = 128, stops = null) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      const fallback = [
        [0, 'rgba(255,255,255,1)'],
        [0.28, 'rgba(255,255,255,0.72)'],
        [0.7, 'rgba(255,255,255,0.15)'],
        [1, 'rgba(255,255,255,0)']
      ];
      (stops || fallback).forEach(([offset, color]) => gradient.addColorStop(offset, color));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    const glowTexture = makeRadialTexture(128);

    function makeGlowSprite(color, scale = 1, opacity = 0.7) {
      const material = new THREE.SpriteMaterial({
        map: glowTexture,
        color,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.setScalar(scale);
      sprite.raycast = () => {};
      return sprite;
    }

    function makeLabelSprite(index, text, color) {
      const c = document.createElement('canvas');
      c.width = 768;
      c.height = 192;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      ctx.font = '650 60px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
      const textWidth = ctx.measureText(text).width;

      ctx.fillStyle = color;
      ctx.globalAlpha = 0.95;
      ctx.fillRect(384 - textWidth / 2 - 23, 88, 4, 30);

      ctx.font = '600 28px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.9;
      ctx.fillText(index, 384, 45);

      ctx.globalAlpha = 1;
      ctx.font = '650 60px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
      ctx.shadowColor = 'rgba(0, 6, 12, 0.9)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = 'rgba(239, 248, 253, 0.94)';
      ctx.fillText(text, 384, 111);
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        opacity: 0.82,
        depthWrite: false,
        depthTest: true,
        fog: false
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(6.25, 1.56, 1);
      sprite.raycast = () => {};
      sprite.userData.noBounds = true;
      return sprite;
    }

    function addTree(x, z, scale = 1, variant = 0) {
      const group = new THREE.Group();
      const trunk = addCylinder(group, 0.08, 0.12, 1.15, 6, MAT.trunk, 0, 0.58, 0);
      trunk.castShadow = true;
      const leafMats = [MAT.leafA, MAT.leafB, MAT.leafC];

      upper.scale.set(0.9, 1.1, 0.9);
      const top = addSphere(group, 0.33, leafMats[(variant + 2) % leafMats.length], -0.1, 2.18, 0.06, 1, { detail: 0 });
      top.scale.set(1.1, 0.9, 1.05);
      group.position.set(x, 0, z);

    // ------------------------------------------------------------
    // Interactive Steerable Campus Vehicle
    // ------------------------------------------------------------
    let isDrivingMode = false;
    const driveKeys = { forward: false, backward: false, left: false, right: false, brake: false };
    let driveVehicle = null;

    function buildSteerableVehicle() {
      const g = new THREE.Group();
      g.position.set(-27.0, 0.08, 12.0);
      g.rotation.y = 0;

      const chassisMat = standard(0x13242e, { roughness: 0.45, metalness: 0.55 });
      const trimMat = basicGlow(0x6fe3a8, 0.85);
      const darkMat = standard(0x0a141b, { roughness: 0.7, metalness: 0.4 });
      const wheelMat = standard(0x080f14, { roughness: 0.85, metalness: 0.2 });
      const rimMat = standard(0x4be4ff, { roughness: 0.35, metalness: 0.8 });

      addBox(g, 1.72, 0.44, 3.6, chassisMat, 0, 0.42, 0);
      addBox(g, 1.76, 0.06, 3.64, trimMat, 0, 0.65, 0, { cast: false });
      addBox(g, 1.62, 0.68, 1.35, chassisMat, 0, 0.95, 1.05);
      addBox(g, 1.54, 0.48, 0.85, MAT.glass, 0, 1.08, 1.15);
      addBox(g, 1.68, 0.82, 2.1, darkMat, 0, 0.95, -0.65);

      const headL = addBox(g, 0.28, 0.12, 0.04, basicGlow(0xffffff, 1.6), -0.62, 0.48, 1.82, { cast: false });
      const headR = addBox(g, 0.28, 0.12, 0.04, basicGlow(0xffffff, 1.6), 0.62, 0.48, 1.82, { cast: false });

      const spotL = new THREE.SpotLight(0xf2faff, 18, 24, Math.PI / 7, 0.35, 1.8);
      spotL.position.set(-0.62, 0.5, 1.85);
      spotL.target.position.set(-0.62, 0.1, 8.0);
      g.add(spotL);
      g.add(spotL.target);

      const spotR = new THREE.SpotLight(0xf2faff, 18, 24, Math.PI / 7, 0.35, 1.8);
      spotR.position.set(0.62, 0.5, 1.85);
      spotR.target.position.set(0.62, 0.1, 8.0);
      g.add(spotR);
      g.add(spotR.target);

      const tailL = addBox(g, 0.34, 0.1, 0.04, basicGlow(0xff2222, 1.2), -0.62, 0.52, -1.82, { cast: false });
      const tailR = addBox(g, 0.34, 0.1, 0.04, basicGlow(0xff2222, 1.2), 0.62, 0.52, -1.82, { cast: false });

      function makeWheel() {
        const wg = new THREE.Group();
        addCylinder(wg, 0.34, 0.34, 0.22, 14, wheelMat, 0, 0, 0, { rz: Math.PI / 2 });
        addCylinder(wg, 0.16, 0.16, 0.23, 10, rimMat, 0, 0, 0, { rz: Math.PI / 2 });
        return wg;
      }

      const pivotFL = new THREE.Group();
      pivotFL.position.set(-0.92, 0.34, 1.15);
      const wheelFL = makeWheel();
      pivotFL.add(wheelFL);
      g.add(pivotFL);

      const pivotFR = new THREE.Group();
      pivotFR.position.set(0.92, 0.34, 1.15);
      const wheelFR = makeWheel();
      pivotFR.add(wheelFR);
      g.add(pivotFR);

      const wheelRL = makeWheel();
      wheelRL.position.set(-0.92, 0.34, -1.15);
      g.add(wheelRL);

      const wheelRR = makeWheel();
      wheelRR.position.set(0.92, 0.34, -1.15);
      g.add(wheelRR);

      CITY.add(g);

      driveVehicle = {
        group: g,
        speed: 0,
        maxSpeed: 14.5,
        accel: 11.0,
        decel: 7.5,
        brakeDecel: 22.0,
        steerAngle: 0,
        maxSteer: 0.52,
        steerSpeed: 3.2,
        heading: 0,
        wheelBase: 2.3,
        pivotFL,
        pivotFR,
        wheelFL,
        wheelFR,
        wheelRL,
        wheelRR,
        tailL,
        tailR
      };
    }

    function updateSteerableVehicle(delta) {
      if (!driveVehicle) return;
      const v = driveVehicle;

      if (isDrivingMode) {
        if (driveKeys.forward) {
          v.speed = Math.min(v.maxSpeed, v.speed + v.accel * delta);
        } else if (driveKeys.backward) {
          v.speed = Math.max(-v.maxSpeed * 0.45, v.speed - v.accel * 0.7 * delta);
        } else {
          if (v.speed > 0) v.speed = Math.max(0, v.speed - v.decel * delta);
          else if (v.speed < 0) v.speed = Math.min(0, v.speed + v.decel * delta);
        }

        if (driveKeys.brake) {
          if (v.speed > 0) v.speed = Math.max(0, v.speed - v.brakeDecel * delta);
          else if (v.speed < 0) v.speed = Math.min(0, v.speed + v.brakeDecel * delta);
          v.tailL.material.opacity = 1.8;
          v.tailR.material.opacity = 1.8;
        } else {
          v.tailL.material.opacity = 0.55;
          v.tailR.material.opacity = 0.55;
        }

        let targetSteer = 0;
        if (driveKeys.left) targetSteer += v.maxSteer;
        if (driveKeys.right) targetSteer -= v.maxSteer;
        v.steerAngle += (targetSteer - v.steerAngle) * Math.min(1, delta * v.steerSpeed * 2.5);

        v.pivotFL.rotation.y = v.steerAngle;
        v.pivotFR.rotation.y = v.steerAngle;

        if (Math.abs(v.speed) > 0.05) {
          const turnRate = (v.speed / v.wheelBase) * Math.sin(v.steerAngle);
          v.heading += turnRate * delta;
          v.group.rotation.y = v.heading;

          v.group.position.x += Math.sin(v.heading) * v.speed * delta;
          v.group.position.z += Math.cos(v.heading) * v.speed * delta;

          const roll = (v.speed / 0.34) * delta;
          v.wheelFL.rotation.x += roll;
          v.wheelFR.rotation.x += roll;
          v.wheelRL.rotation.x += roll;
          v.wheelRR.rotation.x += roll;
        }

        const chaseDist = 6.8;
        const chaseHeight = 2.75;
        const chaseCamPos = new THREE.Vector3(
          v.group.position.x - Math.sin(v.heading) * chaseDist,
          v.group.position.y + chaseHeight,
          v.group.position.z - Math.cos(v.heading) * chaseDist
        );
        const chaseLookAt = new THREE.Vector3(
          v.group.position.x + Math.sin(v.heading) * 1.6,
          v.group.position.y + 0.95,
          v.group.position.z + Math.cos(v.heading) * 1.6
        );
        camera.position.lerp(chaseCamPos, Math.min(1, delta * 6.2));
        camera.lookAt(chaseLookAt);
        controls.target.copy(chaseLookAt);

        if (ui.driveSpeedVal) {
          ui.driveSpeedVal.textContent = Math.abs(Math.round(v.speed * 3.6));
        }
        if (ui.driveGearVal) {
          ui.driveGearVal.textContent = v.speed < -0.2 ? 'R' : 'D';
        }
      } else {
        v.pivotFL.rotation.y = 0;
        v.pivotFR.rotation.y = 0;
        v.tailL.material.opacity = 0.45;
        v.tailR.material.opacity = 0.45;
      }
    }

    buildHarbor();

    // ------------------------------------------------------------

    const boulevardW = 56.0;

    routePoints.push(new THREE.Vector3(-hx + r, 0.06, -hz));
    routePoints.push(new THREE.Vector3(0, 0.06, -hz));
    routePoints.push(new THREE.Vector3(hx - r, 0.06, -hz));

    // NE corner arc
    const cxNE = hx - r, czNE = -hz + r;
    for (let i = 1; i <= 4; i++) {
      const ang = -Math.PI / 2 + (Math.PI / 2) * (i / 5);
      routePoints.push(new THREE.Vector3(cxNE + r * Math.cos(ang), 0.06, czNE + r * Math.sin(ang)));
    }

    // East straight edge (x = hx, traveling South)
    routePoints.push(new THREE.Vector3(hx, 0.06, -hz + r));
    routePoints.push(new THREE.Vector3(hx, 0.06, 0));
    routePoints.push(new THREE.Vector3(hx, 0.06, hz - r));

    // SE corner arc
    const cxSE = hx - r, czSE = hz - r;
    for (let i = 1; i <= 4; i++) {
      const ang = 0 + (Math.PI / 2) * (i / 5);
      routePoints.push(new THREE.Vector3(cxSE + r * Math.cos(ang), 0.06, czSE + r * Math.sin(ang)));
    }

    // South straight edge (z = hz, traveling West)
    routePoints.push(new THREE.Vector3(hx - r, 0.06, hz));
    routePoints.push(new THREE.Vector3(0, 0.06, hz));
    routePoints.push(new THREE.Vector3(-hx + r, 0.06, hz));

    for (let i = 1; i <= 4; i++) {
      const ang = Math.PI / 2 + (Math.PI / 2) * (i / 5);
      routePoints.push(new THREE.Vector3(cxSW + r * Math.cos(ang), 0.06, czSW + r * Math.sin(ang)));
    }

    // West straight edge (x = -hx, traveling North)
    routePoints.push(new THREE.Vector3(-hx, 0.06, hz - r));
    routePoints.push(new THREE.Vector3(-hx, 0.06, 0));
    routePoints.push(new THREE.Vector3(-hx, 0.06, -hz + r));

    // NW corner arc
    const cxNW = -hx + r, czNW = -hz + r;
    for (let i = 1; i <= 4; i++) {
      const ang = Math.PI + (Math.PI / 2) * (i / 5);
      routePoints.push(new THREE.Vector3(cxNW + r * Math.cos(ang), 0.06, czNW + r * Math.sin(ang)));

    const trafficRoute = new THREE.CatmullRomCurve3(routePoints, true, 'centripetal', 0.08);

    // Data flows between the network hub and the districts
    // ------------------------------------------------------------
    function createDataLinks() {
      const origin = new THREE.Vector3(9.4, 14.13, -9.4);
      const targets = [
        new THREE.Vector3(-9.4, 9.22, -9.4),
        new THREE.Vector3(9.4, 17.35, 9.4),
        new THREE.Vector3(-9.4, 6.44, 9.4),
        new THREE.Vector3(0, 3.25, 0)
      ];
      const colors = [0x4be4ff, 0x4be4ff, 0x4be4ff, 0xffd37a];

      targets.forEach((target, index) => {
        const mid = origin.clone().add(target).multiplyScalar(0.5);
        mid.y = Math.max(origin.y, target.y) + 4.2 + index * 0.35;
        mid.x += (index - 1.5) * 0.7;
        const curve = new THREE.QuadraticBezierCurve3(origin.clone(), mid, target.clone());
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 48, 0.018, 4, false),
          new THREE.MeshBasicMaterial({
            color: colors[index],
            transparent: true,
            opacity: index === 3 ? 0.11 : 0.17,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
        CITY.add(tube);

        const packets = [];
        const count = index === 3 ? 1 : 2;
        for (let i = 0; i < count; i += 1) {
          const sprite = makeGlowSprite(colors[index], 0.34, 0.8);
          CITY.add(sprite);
          packets.push({ sprite, shift: i / count + index * 0.13 });
        }
        animated.dataLinks.push({
          curve,
          packets,
          speed: 0.045 + index * 0.006,
          phase: index * 0.17
        });
      });
    }

    function getScreenTexture(kind = 'code', variant = 0) {
      const cacheKey = `${kind}-${variant}`;

      const c = document.createElement('canvas');
      c.width = 320;
      c.height = 200;
      const ctx = c.getContext('2d');
      let seed = 9 + variant * 37 + kind.length * 11;
      const random = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };

      if (kind === 'code') {
        ctx.fillStyle = '#061018';
        ctx.fillRect(0, 0, 320, 200);
        ctx.fillStyle = '#0b202b';
        ctx.fillRect(0, 0, 320, 22);
        ['#ff8f5c', '#ffd37a', '#6fe3a8'].forEach((color, i) => {
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.72;
          ctx.beginPath();
          ctx.arc(13 + i * 13, 11, 3.2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#6d8a99';
        ctx.font = '9px ui-monospace, monospace';
        ctx.fillText(variant % 2 ? 'workspace / sprint' : 'hackathon / live', 66, 14);

          const y = 39 + row * 15;
          ctx.globalAlpha = 0.42;
          ctx.fillStyle = '#335063';
          ctx.font = '8px ui-monospace, monospace';
          ctx.fillText(String(row + 1).padStart(2, '0'), 8, y);
          let x = 40 - random() * 10;
          const segments = 2 + Math.floor(random() * 3);
          for (let s = 0; s < segments; s += 1) {
            const width = 18 + random() * 74;
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = colors[Math.floor(random() * colors.length)];
            ctx.fillRect(x, y - 5, width, 3);
            x += width + 7;
          }
        }
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = '#85f6ff';
        ctx.fillRect(40, 66, 2, 10);
      } else if (kind === 'chart') {
        const gradient = ctx.createLinearGradient(0, 0, 320, 200);
        gradient.addColorStop(0, '#0a1a22');
        gradient.addColorStop(1, '#071018');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 320, 200);
        ctx.strokeStyle = 'rgba(112, 154, 172, 0.18)';
        for (let i = 1; i < 5; i += 1) {
          ctx.beginPath();
          ctx.moveTo(28, 30 + i * 28);
          ctx.lineTo(296, 30 + i * 28);
          ctx.stroke();
        }
        ctx.strokeStyle = '#ffd37a';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const x = 30 + i * 29;
          const y = 145 - (i * 9 + random() * 17);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 211, 122, 0.14)';
        ctx.lineTo(291, 168);
        ctx.lineTo(30, 168);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#6fe3a8';
        ctx.fillRect(292, 28, 4, 4);
        ctx.fillStyle = '#8ea9b7';
        ctx.font = '9px ui-monospace, monospace';
        ctx.fillText('LIVE KPI', 30, 25);
        for (let i = 0; i < 6; i += 1) {
          ctx.fillStyle = i % 2 ? '#ffd37a' : '#4be4ff';
          ctx.globalAlpha = 0.5 + random() * 0.45;
          ctx.fillRect(30 + i * 43, 171 - random() * 22, 14, 22 + random() * 10);
        }
      } else if (kind === 'arena') {
        const gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, '#041722');
        gradient.addColorStop(0.55, '#062936');
        gradient.addColorStop(1, '#031018');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 320, 200);
        ctx.strokeStyle = 'rgba(75, 228, 255, 0.22)';

          ctx.stroke();
        }
        for (let i = 0; i < 6; i += 1) {
          ctx.fillStyle = i % 2 ? 'rgba(111, 227, 168, 0.55)' : 'rgba(75, 228, 255, 0.6)';
          const height = 10 + ((i * 37) % 30);

        ctx.fillStyle = '#ffd37a';
        ctx.font = '700 20px ui-monospace, monospace';
        ctx.fillText('42:00', 234, 54);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#4be4ff';
        ctx.fillRect(24, 164, 272, 2);
      } else if (kind === 'machine') {
        ctx.fillStyle = '#07110d';
        ctx.fillRect(0, 0, 320, 200);
        ctx.strokeStyle = 'rgba(111, 227, 168, 0.18)';
        ctx.strokeRect(18, 18, 284, 164);
        ctx.fillStyle = '#6fe3a8';
        ctx.font = '10px ui-monospace, monospace';
        ctx.fillText('CNC / AXIS CONTROL', 34, 42);
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = '#b9ffd9';
        ctx.font = '600 38px ui-monospace, monospace';
        ctx.fillText(`X ${(128.4 + variant * 3.2).toFixed(1)}`, 34, 88);
        ctx.font = '600 29px ui-monospace, monospace';

          ctx.arc(252 - i * 17, 90, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#07141a';

        for (let i = 0; i < 12; i += 1) {

          ctx.beginPath();

        ctx.lineTo(168, 103);

        ctx.beginPath();

        [0, 1, 2].forEach((i) => ctx.fillRect(24 + i * 12, 177, 7, 7));

      }

      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      screenTextureCache.set(cacheKey, texture);
      return texture;
    }

    function getScreenMaterial(kind = 'code', variant = 0) {
      const cacheKey = `${kind}-${variant}`;
      if (!screenMaterialCache.has(cacheKey)) {
        screenMaterialCache.set(cacheKey, new THREE.MeshBasicMaterial({
          map: getScreenTexture(kind, variant),

    function createRoom(key, config) {
      const [x, z] = BUILDING_POSITIONS[key];
      const group = new THREE.Group();
      group.position.set(x, 0.08, z);
      group.visible = false;
      CITY.add(group);

      const shell = new THREE.Mesh(
        new THREE.BoxGeometry(config.width, config.height, config.depth),
        new THREE.MeshStandardMaterial({
          color: config.wallColor ?? 0x101b22,
          roughness: 0.94,
          metalness: 0.06,
          side: THREE.BackSide
        })
      );
      shell.position.y = config.height / 2;
      shell.castShadow = false;
      shell.receiveShadow = true;
      group.add(shell);

      const floorMat = config.floorMaterial ?? INTERIOR.floor;
      addBox(group, config.width - 0.08, 0.07, config.depth - 0.08, floorMat, 0, 0.035, 0, { cast: false });

      const accentColor = new THREE.Color(config.accent);
      const accentLine = basicGlow(accentColor, 0.42);
      addBox(group, config.width - 0.5, 0.012, 0.035, accentLine, 0, 0.077, config.depth / 2 - 0.52, { cast: false });
      addBox(group, 0.035, 0.012, config.depth - 1.1, accentLine, -config.width / 2 + 0.4, 0.077, 0, { cast: false });

      const tileLine = basicGlow(accentColor, 0.1);
      for (let i = -2; i <= 2; i += 1) {
        addBox(group, 0.015, 0.01, config.depth - 0.8, tileLine, (i * config.width) / 6, 0.075, 0, { cast: false });
        addBox(group, config.width - 0.8, 0.01, 0.015, tileLine, 0, 0.075, (i * config.depth) / 6, { cast: false });
      }

      // Wall panel rhythm
      const panelMat = basicGlow(0x355263, 0.16);
      for (let i = -2; i <= 2; i += 1) {
        addBox(group, 0.025, config.height - 0.55, 0.035, panelMat, (i * config.width) / 5.5, config.height / 2 - 0.08, -config.depth / 2 + 0.045, { cast: false });
        addBox(group, 0.035, config.height - 0.55, 0.025, panelMat, -config.width / 2 + 0.045, config.height / 2 - 0.08, (i * config.depth) / 5.5, { cast: false });
        addBox(group, 0.025, config.height - 0.55, 0.035, panelMat, (i * config.width) / 5.5, config.height / 2 - 0.08, config.depth / 2 - 0.045, { cast: false });
      }

      // Ceiling light bars
      for (let i = -1; i <= 1; i += 1) {
        addBox(
          group,
          0.3,
          0.035,
          config.depth * 0.56,
          basicGlow(0xfff1d4, 0.76),
          i * config.width * 0.27,
          config.height - 0.14,
          0,
          { cast: false, receive: false }
        );
      }

      const lightColor = new THREE.Color(config.lightColor ?? 0xd7efff);
      const light = new THREE.PointLight(lightColor, config.lightIntensity ?? 32, Math.max(config.width, config.depth) * 1.65, 2);
      light.position.set(0, config.height - 0.45, 0.9);
      group.add(light);
      const accentLight = new THREE.PointLight(accentColor, config.accentIntensity ?? 17, 9, 2);
      accentLight.position.set(0, Math.min(2.2, config.height - 0.8), -config.depth * 0.23);
      group.add(accentLight);

      const room = {
        group,
        width: config.width,
        depth: config.depth,
        height: config.height,
        accent: config.accent,
        cam: config.cam,
        look: config.look
      };
      interiors[key] = room;
      return room;

    function makeSkylineTexture() {
      const c = document.createElement('canvas');
      c.width = 768;
      c.height = 300;
      const ctx = c.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, '#06101c');
      gradient.addColorStop(0.62, '#0a2637');
      gradient.addColorStop(1, '#123948');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 768, 300);
      ctx.fillStyle = 'rgba(111, 227, 255, 0.16)';
      for (let i = 0; i < 40; i += 1) {
        ctx.fillRect((i * 197) % 768, 12 + (i * 37) % 90, 1.4, 1.4);
      }
      let seed = 41;
      const random = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
      for (let layer = 0; layer < 3; layer += 1) {
        ctx.globalAlpha = 0.55 + layer * 0.2;
        let x = -20;
        while (x < 800) {
          const width = 20 + random() * 55;
          const height = 50 + random() * (130 - layer * 25);
          ctx.fillStyle = layer === 0 ? '#081925' : layer === 1 ? '#0a202c' : '#0d2835';
          ctx.fillRect(x, 300 - height, width, height);
          ctx.fillStyle = layer === 2 ? 'rgba(255, 211, 122, 0.5)' : 'rgba(75, 228, 255, 0.28)';
          for (let wy = 300 - height + 9; wy < 290; wy += 11) {
            for (let wx = x + 5; wx < x + width - 4; wx += 8) {
              if (random() > 0.4) ctx.fillRect(wx, wy, 2, 3);
            }
          }
          x += width + 7 + random() * 10;
        }
      }
      ctx.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      return texture;

      const c = document.createElement('canvas');

      // Distant city glow
      ctx.fillStyle = 'rgba(75, 228, 255, 0.08)';
      ctx.fillRect(0, 205, 1024, 58);
      let seed = 71;
      const random = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
      for (let i = 0; i < 46; i += 1) {
        const w = 7 + random() * 18;
        const h = 14 + random() * 54;
        ctx.fillStyle = i % 3 ? '#081d28' : '#0a2531';
        ctx.fillRect(i * 23 - 8, 262 - h, w, h);
        ctx.fillStyle = i % 2 ? 'rgba(255, 211, 122, 0.42)' : 'rgba(75, 228, 255, 0.34)';
        for (let wy = 262 - h + 5; wy < 256; wy += 8) {
          for (let wx = i * 23 - 5; wx < i * 23 + w - 2; wx += 6) {

          }
        }
      }

      // Quay cranes
      const drawCrane = (x, height, reach) => {
        ctx.strokeStyle = 'rgba(17, 48, 60, 0.98)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x - 28, 266);
        ctx.lineTo(x - 28, 266 - height + 46);
        ctx.moveTo(x + 28, 266);
        ctx.lineTo(x + 28, 266 - height + 46);
        ctx.moveTo(x - 34, 266 - height + 52);
        ctx.lineTo(x + 34, 266 - height + 52);
        ctx.stroke();
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(x - 10, 266 - height);
        ctx.lineTo(x + reach, 266 - height + 24);
        ctx.moveTo(x + 52, 266 - height - 16);
        ctx.lineTo(x + 52, 266 - height + 24);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(75, 228, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 52, 266 - height + 24);
        ctx.lineTo(x + 52, 248);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 211, 122, 0.9)';
        ctx.fillRect(x - 3, 266 - height - 4, 6, 6);

      const drawShip = (x, y, width, hullColor) => {
        ctx.fillStyle = hullColor;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width, y);
        ctx.lineTo(x + width - 28, y + 30);
        ctx.lineTo(x + 18, y + 30);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#0c2b35';
        ctx.fillRect(x + width - 92, y - 52, 54, 52);
        ctx.fillStyle = 'rgba(255, 211, 122, 0.72)';
        for (let i = 0; i < 7; i += 1) ctx.fillRect(x + width - 84 + (i % 4) * 11, y - 44 + Math.floor(i / 4) * 12, 6, 4);

      ctx.fillRect(0, 0, 1024, 10);

      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    function getOverviewFov() {
      return camera.aspect < 0.72 ? 56 : camera.aspect < 1.12 ? 48 : 42;
    }

    function getInteriorFov() {
      return camera.aspect < 0.82 ? 68 : camera.aspect < 1.2 ? 62 : 58;
    }

    function setViewport() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      const targetFov = selectedKey ? getInteriorFov() : getOverviewFov();
      if (cameraTween) {
        cameraTween.toFov = targetFov;
      } else {
        camera.fov = targetFov;
        camera.updateProjectionMatrix();
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height);
      if (animated.smoke) {
        animated.smoke.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
      }
    }

    function getHomePosition() {
      const aspect = camera.aspect;
      const distance = aspect < 0.8 ? 82 : aspect < 1.15 ? 64 : 57;
      return homeTarget.clone().addScaledVector(homeDir, distance);
    }

    function tweenCamera(toPosition, toTarget, duration = 1.3, toFov = null) {
      cameraTween = {
        fromPosition: camera.position.clone(),
        toPosition: toPosition.clone(),
        fromTarget: controls.target.clone(),
        toTarget: toTarget.clone(),
        fromFov: camera.fov,
        toFov: toFov ?? getOverviewFov(),
        elapsed: 0,
        duration
      };
      controls.enabled = false;
    }

    function cancelCameraTween() {
      cameraTween = null;
      controls.enabled = true;
    }

    function getInteriorView(key) {
      const room = interiors[key];
      const [x, z] = BUILDING_POSITIONS[key];
      const portrait = camera.aspect < 0.82;
      const position = new THREE.Vector3(
        x + room.cam[0],
        room.cam[1] + (portrait ? 0.08 : 0),
        z + room.cam[2]
      );
      const target = new THREE.Vector3(
        x + room.look[0],
        room.look[1] + (portrait ? 0.06 : 0),
        z + room.look[2]
      );
      return { position, target, fov: getInteriorFov() };
    }

    function setCameraMode(inside) {
      controls.enablePan = !inside;
      controls.minDistance = inside ? 2.1 : 13;
      controls.maxDistance = inside ? 9.8 : 135;
      controls.minPolarAngle = inside ? 0.46 : 0.22;
      controls.maxPolarAngle = inside ? 1.54 : Math.PI / 2 - 0.055;
    }

    function clampToInterior(key) {
      const room = interiors[key];
      if (!room) return;
      const [x, z] = BUILDING_POSITIONS[key];
      const halfW = room.width / 2 - 0.36;
      const halfD = room.depth / 2 - 0.36;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, x - halfW, x + halfW);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, z - halfD, z + halfD);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, 0.56, room.height - 0.32);
      controls.target.x = THREE.MathUtils.clamp(controls.target.x, x - halfW, x + halfW);
      controls.target.z = THREE.MathUtils.clamp(controls.target.z, z - halfD, z + halfD);
      controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0.5, room.height - 0.38);
    }

    function hideInteriors() {
      Object.values(interiors).forEach((room) => {
        room.group.visible = false;
      });
    }

    function setLabelTargets(activeKey) {
      Object.entries(labelSprites).forEach(([key, sprite]) => {
        sprite.userData.targetOpacity = activeKey ? 0 : 0.82;
      });
    }

    function updateNavState() {
      ui.navButtons.forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.focus === selectedKey);
      });
      document.body.classList.toggle('has-selection', Boolean(selectedKey));
    }

    function enterDriveMode() {
      if (isDrivingMode) return;
      if (cameraTween) cancelCameraTween();
      if (selectedKey) {
        hideInteriors();
        selectedKey = null;
        updateNavState();
        setLabelTargets(null);
      }
      isDrivingMode = true;
      document.body.classList.add('is-driving');
      controls.enabled = false;
      hideHover();
      if (driveVehicle) {
        const v = driveVehicle;
        const chaseDist = 6.8;
        const chaseHeight = 2.75;
        camera.position.set(
          v.group.position.x - Math.sin(v.heading) * chaseDist,
          v.group.position.y + chaseHeight,
          v.group.position.z - Math.cos(v.heading) * chaseDist
        );
        const chaseLookAt = new THREE.Vector3(
          v.group.position.x + Math.sin(v.heading) * 1.6,
          v.group.position.y + 0.95,
          v.group.position.z + Math.cos(v.heading) * 1.6
        );
        camera.lookAt(chaseLookAt);
        controls.target.copy(chaseLookAt);
      }
    }

    function exitDriveMode(returnOverview = true) {
      if (!isDrivingMode) return;
      isDrivingMode = false;
      if (driveVehicle) {
        driveVehicle.speed = 0;
        driveVehicle.steerAngle = 0;
      }
      document.body.classList.remove('is-driving');
      controls.enabled = true;
      if (returnOverview) showOverview();
    }

    function toggleDriveMode() {
      if (isDrivingMode) exitDriveMode(true);
      else enterDriveMode();
    }

    function focusBuilding(key) {
      if (isDrivingMode) {
        isDrivingMode = false;
        if (driveVehicle) { driveVehicle.speed = 0; driveVehicle.steerAngle = 0; }
        document.body.classList.remove('is-driving');
        controls.enabled = true;
      }
      Object.values(buildingGroups).forEach((b) => { b.visible = true; });
      if (!BUILDING_DATA[key] || !interiors[key]) return;
      if (selectedKey !== key) hideInteriors();
      interiors[key].group.visible = true;
      const view = getInteriorView(key);
      selectedKey = key;
      setLabelTargets(key);
      updateNavState();
      setCameraMode(true);
      tweenCamera(view.position, view.target, 1.4, view.fov);
      hideHover();
    }

    function showOverview() {
      if (isDrivingMode) {
        isDrivingMode = false;
        if (driveVehicle) { driveVehicle.speed = 0; driveVehicle.steerAngle = 0; }
        document.body.classList.remove('is-driving');
        controls.enabled = true;
      }
      Object.values(buildingGroups).forEach((b) => { b.visible = true; });
      const wasInside = Boolean(selectedKey);
      selectedKey = null;
      hoveredKey = null;
      setLabelTargets(null);
      updateNavState();
      setCameraMode(false);
      hideHover();
      tweenCamera(getHomePosition(), homeTarget, wasInside ? 1.45 : 1.35, getOverviewFov());
    }

    function hideHover() {
      hoveredKey = null;
      canvas.classList.remove('is-hovering');
      ui.hoverTag.classList.remove('is-visible');
    }

    function getKeyAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickables, true);
      for (let i = 0; i < hits.length; i += 1) {
        let object = hits[i].object;
        while (object && !object.userData.focusId) object = object.parent;
        if (object && object.userData.focusId) return object.userData.focusId;
      }
      return null;
    }

    function updateHover(clientX, clientY) {
      if (selectedKey) {
        hideHover();
        return;
      }
      const key = getKeyAt(clientX, clientY);
      canvas.classList.toggle('is-hovering', Boolean(key));
      if (key && key !== selectedKey) {
        hoveredKey = key;
        const data = BUILDING_DATA[key];
        ui.hoverTag.style.setProperty('--dot', data.color);
        ui.hoverName.textContent = data.name;
        ui.hoverTag.style.left = `${clientX}px`;
        ui.hoverTag.style.top = `${clientY}px`;
        ui.hoverTag.classList.add('is-visible');
      } else {
        hoveredKey = key || null;
        ui.hoverTag.classList.remove('is-visible');
      }
    }

    canvas.addEventListener('pointermove', (event) => {
      if (event.pointerType === 'touch') return;
      if (pointerDown) {
        ui.hoverTag.classList.remove('is-visible');
        return;
      }
      updateHover(event.clientX, event.clientY);
    });

    canvas.addEventListener('pointerleave', () => {
      hideHover();
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      pointerDown = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener('pointerup', (event) => {
      if (!pointerDown) return;
      const dx = event.clientX - pointerDown.x;
      const dy = event.clientY - pointerDown.y;
      pointerDown = null;
      if (selectedKey || dx * dx + dy * dy > 38) return;
      const key = getKeyAt(event.clientX, event.clientY);
      if (key) focusBuilding(key);
    });

    canvas.addEventListener('pointercancel', () => {
      pointerDown = null;
      hideHover();
    });

    canvas.addEventListener('contextmenu', (event) => event.preventDefault());

    ui.overview.addEventListener('click', showOverview);
    if (ui.driveBtn) ui.driveBtn.addEventListener('click', toggleDriveMode);
    ui.navButtons.forEach((button) => {
      button.addEventListener('click', () => focusBuilding(button.dataset.focus));
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') driveKeys.forward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') driveKeys.backward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') driveKeys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') driveKeys.right = true;
      if (e.code === 'Space') { driveKeys.brake = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') driveKeys.forward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') driveKeys.backward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') driveKeys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') driveKeys.right = false;
      if (e.code === 'Space') driveKeys.brake = false;
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (isDrivingMode) {
          exitDriveMode(true);
          return;
        }
        if (selectedKey) {
          showOverview();
          return;
        }
      }
      if ((event.key === 'v' || event.key === 'V') && !event.ctrlKey && !event.altKey && !event.metaKey) {
        toggleDriveMode();
        return;
      }
      if (!isDrivingMode) {
        const index = ['1', '2', '3', '4'].indexOf(event.key);
        if (index !== -1) focusBuilding(focusOrder[index]);
      }
    });

    window.addEventListener('resize', setViewport);

    window.addEventListener('blur', hideHover);

    // ------------------------------------------------------------
    // Animation loop
    // ------------------------------------------------------------
    function resetSmokeParticle(particle) {
      particle.age = 0;
      particle.life = 2.6 + Math.random() * 2.2;
      particle.driftX = (Math.random() - 0.5) * 0.6;
      particle.driftZ = (Math.random() - 0.5) * 0.6;
      particle.phase = Math.random() * Math.PI * 2;
      particle.scale = 0.62 + Math.random() * 0.7;
    }

    function updateSmoke(delta) {
      const smoke = animated.smoke;
      if (!smoke) return;
      const { parts, positions, sizes, opacities, geometry } = smoke;
      for (let i = 0; i < parts.length; i += 1) {
        const particle = parts[i];
        particle.age += delta * (0.82 + particle.scale * 0.2);
        if (particle.age > particle.life) resetSmokeParticle(particle);
        const t = particle.age / particle.life;
        const rise = t * (2.15 + particle.life * 0.33);
        positions[i * 3] = particle.origin.x + particle.driftX * t + Math.sin(particle.phase + t * 5.4) * 0.18 * t;
        positions[i * 3 + 1] = particle.origin.y + rise;
        positions[i * 3 + 2] = particle.origin.z + particle.driftZ * t + Math.cos(particle.phase + t * 4.2) * 0.13 * t;
        sizes[i] = (0.16 + t * 0.98) * particle.scale;
        opacities[i] = smoothstep(Math.min(1, t / 0.12)) * (1 - t) * 0.66;
      }
      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.aSize.needsUpdate = true;
      geometry.attributes.aOpacity.needsUpdate = true;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    const tmpVehiclePoint = new THREE.Vector3();
    const tmpVehicleTangent = new THREE.Vector3();
    let firstFrame = true;

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      updateSmoke(delta);

      // Factory fans
      animated.fans.forEach((fan, index) => {
        fan.rotation.z -= delta * (3.0 + index * 0.45);
      });

      // Server LEDs and data bands
      animated.serverPulse.forEach((entry, index) => {
        const wave = 0.5 + 0.5 * Math.sin(elapsed * 2.55 + (entry.offset ?? index * 0.7));
        entry.material.emissiveIntensity = 0.5 + wave * 1.28;
      });

      // Holographic rings and cores
      animated.holoRings.forEach((ring, index) => {
        ring.rotation.z += delta * (0.34 + index * 0.075);
        ring.rotation.y += delta * 0.11;
      });
      if (animated.holoCore) {
        animated.holoCore.rotation.y = elapsed * 0.38;
        animated.holoCore.rotation.x = elapsed * 0.17;
        animated.holoCore.position.y = 2.55 + Math.sin(elapsed * 1.15) * 0.08;
      }
      hubHolo.rotation.y = elapsed * 0.26;
      hubHolo.position.y = 10.75 + Math.sin(elapsed * 1.3) * 0.055;
      hubCore.rotation.x = elapsed * 0.22;
      hubCore.rotation.y = elapsed * 0.41;

      // Business tower details
      if (animated.elevator) {
        const cycle = 0.5 - 0.5 * Math.cos(elapsed * 0.57);
        const y = animated.elevator.baseY + animated.elevator.travel * cycle;
        animated.elevator.mesh.position.y = y;
        animated.elevator.halo.position.y = y;
        animated.elevator.halo.material.opacity = 0.32 + 0.2 * (0.5 + 0.5 * Math.sin(elapsed * 2.2));
      }
      if (animated.beacon) {
        const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.25);
        animated.beacon.mesh.scale.setScalar(1 + pulse * 0.28);
        animated.beacon.halo.material.opacity = 0.4 + pulse * 0.42;
        animated.beacon.halo.scale.setScalar(1.9 + pulse * 0.55);
      }
      if (animated.radar) {
        animated.radar.rotation.y = elapsed * 0.55;
      }

      // Interior working life
      animated.typing.forEach((person) => {
        const beat = elapsed * 6.2 + person.phase;
        person.arms[0].rotation.x = 1.02 + Math.sin(beat) * 0.085;
        person.arms[1].rotation.x = 1.02 + Math.sin(beat + 1.7) * 0.085;
        person.arms[0].rotation.z = -0.09 + Math.sin(beat * 0.57) * 0.025;
        person.arms[1].rotation.z = 0.09 - Math.sin(beat * 0.53) * 0.025;
        person.head.rotation.x = Math.sin(elapsed * 1.3 + person.phase) * 0.022;
        person.head.rotation.y = Math.sin(elapsed * 0.72 + person.phase) * 0.045;
        person.group.position.y = Math.sin(elapsed * 1.4 + person.phase) * 0.003;
      });

      animated.interiorLeds.forEach((led) => {
        const pulse = 0.5 + 0.5 * Math.sin(elapsed * 3.4 + led.phase);
        led.material.emissiveIntensity = 0.45 + pulse * 1.25;
      });

      animated.machineSpin.forEach((machine) => {
        machine.object.rotation[machine.axis] += delta * machine.speed;
      });
      animated.machineSlides.forEach((machine) => {
        machine.object.position.y = machine.baseY + Math.sin(elapsed * machine.speed + machine.phase) * machine.amplitude;
      });

      animated.robots.forEach((robot) => {
        robot.turret.rotation.y = Math.sin(elapsed * 0.58 + robot.phase) * 0.7;
        robot.lower.rotation.z = robot.baseLower + Math.sin(elapsed * 0.8 + robot.phase) * 0.09;
        robot.upper.rotation.z = robot.baseUpper + Math.sin(elapsed * 0.92 + robot.phase + 1.1) * 0.18;
        robot.wrist.rotation.z = -1.2 + Math.sin(elapsed * 1.2 + robot.phase + 2.1) * 0.3;
      });

      animated.beltItems.forEach((belt) => {
        belt.items.forEach((item, index) => {
          const progress = (elapsed * belt.speed + index / belt.items.length) % 1;
          item.position.x = -belt.length / 2 + 0.32 + progress * (belt.length - 0.64);
          item.position.y = 1.06 + Math.sin(elapsed * 8 + index) * 0.008;
        });
      });

      animated.forklifts.forEach((forklift) => {
        const cycle = (elapsed * forklift.speed + forklift.phase) % 2;
        const progress = cycle < 1 ? cycle : 2 - cycle;
        const wobble = Math.sin(elapsed * 0.32 + forklift.phase) * 0.055;
        if (forklift.axis === 'x') {
          forklift.group.position.x = forklift.x + progress * forklift.range;
          forklift.group.position.z = forklift.z + wobble;
          forklift.group.rotation.y = cycle < 1 ? -Math.PI / 2 : Math.PI / 2;
        } else {
          forklift.group.position.z = forklift.z - progress * forklift.range;
          forklift.group.position.x = forklift.x + wobble;
          forklift.group.rotation.y = cycle < 1 ? 0 : Math.PI;
        }
        forklift.carriage.position.y = forklift.baseCarriageY + 0.12 + Math.sin(elapsed * 0.75 + forklift.phase) * 0.08;
      });

      animated.agvs.forEach((agv) => {
        const cycle = (elapsed * agv.speed + agv.phase) % 2;
        const progress = cycle < 1 ? cycle : 2 - cycle;
        const wobble = Math.sin(elapsed * 0.42 + agv.phase) * 0.03;
        if (agv.axis === 'z') {
          agv.group.position.z = agv.baseZ - progress * agv.range;
          agv.group.position.x = agv.baseX + wobble;
          agv.group.rotation.y = cycle < 1 ? Math.PI : 0;
        } else {
          agv.group.position.x = agv.baseX + progress * agv.range;
          agv.group.position.z = agv.baseZ + wobble;
          agv.group.rotation.y = cycle < 1 ? Math.PI / 2 : -Math.PI / 2;
        }
      });

      if (animated.aisleCrane) {
        const crane = animated.aisleCrane;
        crane.bridge.position.z = 0.85 + Math.sin(elapsed * 0.19) * 2.2;
        crane.trolley.position.x = Math.sin(elapsed * 0.33 + 0.6) * 4.5;
        crane.hoist.position.y = -0.3 + Math.sin(elapsed * 0.5 + 1.2) * 0.35;
      }

      // Harbor water procedural waves
      if (animated.harborWater) {
        const geo = animated.harborWater.geometry;
        const pos = geo.attributes.position;
        const base = geo.userData.base;
        for (let i = 0; i < pos.count; i++) {
          const bx = base[i * 3];
          const bz = base[i * 3 + 2];
          const wave = Math.sin(bx * 0.38 + elapsed * 1.7) * 0.08 + Math.cos(bz * 0.32 + elapsed * 1.3) * 0.06;
          pos.setY(i, wave);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
      }

      // Harbor ships bobbing
      animated.harborShips.forEach((ship) => {
        if (ship.isTug) {
          ship.group.rotation.z = Math.sin(elapsed * 0.9 + 1.2) * 0.02;
          ship.group.rotation.x = Math.cos(elapsed * 0.75 + 0.4) * 0.015;
          ship.group.position.y = -0.52 + Math.sin(elapsed * 1.1 + 0.8) * 0.025;
        } else {
          ship.group.rotation.z = Math.sin(elapsed * 0.52) * 0.009;
          ship.group.rotation.x = Math.cos(elapsed * 0.38) * 0.006;
          ship.group.position.y = -0.52 + Math.sin(elapsed * 0.65) * 0.02;
        }
      });

      // Marine Buoys & Lighthouse Beam
      animated.buoys.forEach((b) => {
        b.mesh.position.y = b.baseY + Math.sin(elapsed * 1.6 + b.phase) * 0.09;
        b.mesh.rotation.z = Math.sin(elapsed * 1.2 + b.phase) * 0.08;
        b.mesh.rotation.x = Math.cos(elapsed * 1.1 + b.phase) * 0.06;
      });
      if (animated.lighthouseBeam) {
        animated.lighthouseBeam.rotation.y = elapsed * 0.85;
      }
      animated.radars.forEach((r) => {
        r.rotation.y = elapsed * 3.8;
      });
      animated.highwayVehicles.forEach((v) => {
        v.mesh.position.x -= v.speed * delta;
        if (v.mesh.position.x < v.minX) v.mesh.position.x = v.maxX;
      });

      // Harbor container cranes
      animated.harborCranes.forEach((crane) => {
        const cycle = Math.sin(elapsed * 0.22 + crane.phase);
        crane.trolley.position.x = -32.0 + cycle * 6.5;
        crane.hoist.position.y = -3.2 + Math.sin(elapsed * 0.4 + crane.phase) * 1.1;
      });

      // Interactive steerable vehicle physics & chase camera
      updateSteerableVehicle(delta);

      animated.holoBars.forEach((bar) => {
        bar.mesh.scale.y = 0.82 + 0.2 * (0.5 + 0.5 * Math.sin(elapsed * 1.5 + bar.phase));
      });
      if (animated.towerHolo) {
        animated.towerHolo.rotation.y = elapsed * 0.24;
        animated.towerHolo.position.y = 1.14 + Math.sin(elapsed * 1.1) * 0.035;
      }
      if (animated.badgeCore) {
        animated.badgeCore.rotation.y = elapsed * 0.55;
        animated.badgeCore.rotation.x = elapsed * 0.24;
        animated.badgeCore.position.y = Math.sin(elapsed * 1.25) * 0.04;
      }
      if (animated.hoist) {
        animated.hoist.position.x = 0.6 + Math.sin(elapsed * 0.22) * 1.85;
      }
      animated.sparkFlicker.forEach((spark) => {
        const flicker = 0.5 + 0.5 * Math.sin(elapsed * 23 + spark.phase * 4);
        spark.sprite.material.opacity = 0.16 + flicker * 0.62;
        spark.sprite.scale.setScalar(0.34 + flicker * 0.34);
      });

      // Conveyor parcels
      animated.conveyorCrates.forEach((crate) => {
        const progress = (elapsed * 0.245 + crate.offset) % 1;
        crate.mesh.position.set(-2.12 + progress * 4.24, 1.255 + Math.sin(elapsed * 13 + crate.offset * 8) * 0.012, 4.1);
        crate.mesh.rotation.y = Math.sin(elapsed * 2 + crate.offset * 5) * 0.035;
      });

      // Ring-road traffic
      animated.vehicles.forEach((vehicle) => {
        const progress = (elapsed * vehicle.speed + vehicle.offset) % 1;
        trafficRoute.getPointAt(progress, tmpVehiclePoint);
        trafficRoute.getTangentAt(progress, tmpVehicleTangent);
        vehicle.mesh.position.set(tmpVehiclePoint.x, 0.06, tmpVehiclePoint.z);
        vehicle.mesh.lookAt(
          tmpVehiclePoint.x + tmpVehicleTangent.x,
          0.06,
          tmpVehiclePoint.z + tmpVehicleTangent.z
        );
      });

      // Data packets
      animated.dataLinks.forEach((link) => {
        link.packets.forEach((packet) => {
          const t = (elapsed * link.speed + packet.shift + link.phase) % 1;
          link.curve.getPointAt(t, packet.sprite.position);
          const flicker = 0.5 + 0.5 * Math.sin(elapsed * 5.5 + packet.shift * 12);
          packet.sprite.scale.setScalar(0.24 + flicker * 0.12);
          packet.sprite.material.opacity = 0.42 + flicker * 0.4;
        });
      });

      // Subtle movement in the landscape
      animated.trees.forEach((tree) => {
        tree.group.rotation.z = Math.sin(elapsed * 0.55 + tree.phase) * 0.007;
        tree.group.rotation.x = Math.cos(elapsed * 0.44 + tree.phase) * 0.005;
      });
      dust.rotation.y = elapsed * 0.006;

      // District selection rings
      Object.entries(selectRings).forEach(([key, ring]) => {
        const isSelected = key === selectedKey;
        const isHovered = key === hoveredKey;
        const targetOpacity = isSelected
          ? 0.44 + Math.sin(elapsed * 2.15) * 0.08
          : isHovered
            ? 0.19
            : 0;
        ring.material.opacity += (targetOpacity - ring.material.opacity) * Math.min(1, delta * 9);
        const targetScale = isSelected ? 1.015 + Math.sin(elapsed * 1.6) * 0.012 : 1;
        ring.mesh.scale.lerp(new THREE.Vector3(targetScale, 1, targetScale), Math.min(1, delta * 6));
      });

      // Labels fade according to the current focus
      Object.values(labelSprites).forEach((sprite) => {
        const target = sprite.userData.targetOpacity ?? 0.82;
        sprite.material.opacity += (target - sprite.material.opacity) * Math.min(1, delta * 5.5);
      });

      // Camera movement
      if (cameraTween) {
        cameraTween.elapsed += delta;
        const t = clamp01(cameraTween.elapsed / cameraTween.duration);
        const eased = easeInOutCubic(t);
        camera.position.lerpVectors(cameraTween.fromPosition, cameraTween.toPosition, eased);
        controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, eased);
        camera.fov = THREE.MathUtils.lerp(cameraTween.fromFov, cameraTween.toFov, eased);
        camera.updateProjectionMatrix();
        camera.lookAt(controls.target);
        if (t >= 1) {
          cameraTween = null;
          controls.enabled = true;
          if (selectedKey) {
            if (buildingGroups[selectedKey]) buildingGroups[selectedKey].visible = false;
            clampToInterior(selectedKey);
            camera.lookAt(controls.target);
          } else {
            hideInteriors();
          }
          controls.update();
        }
      } else {
        controls.update();
        if (selectedKey) {
          clampToInterior(selectedKey);
          camera.lookAt(controls.target);
        }
      }

      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        requestAnimationFrame(() => {
          document.body.classList.add('is-ready');
          const loader = document.getElementById('loader');
          window.setTimeout(() => loader?.remove(), 1150);
        });
      }
    }

    // ------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------
    setViewport();
    camera.position.copy(getHomePosition());
    camera.lookAt(homeTarget);
    controls.target.copy(homeTarget);
    controls.update();
    setLabelTargets(null);
    updateSmoke(0);
    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
